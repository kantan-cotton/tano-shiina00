{{- $src := .Get 0 -}}
{{- $link := .Get 1 -}}
{{- $alt := .Get 2 -}}
{{- $caption := .Get 3 -}}

{{- $image := .Page.Resources.Get $src -}}

{{- if $image -}}
  {{- $src = $image.RelPermalink -}}
{{- end -}}

<figure>
  <a href="{{ $link }}">
    <img src="{{ $src }}" alt="{{ $alt }}">
  </a>
  {{- with $caption }}
    <figcaption>{{ . }}</figcaption>
  {{- end }}
</figure>
